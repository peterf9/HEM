name: HEM CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-test:
    name: Build, Validate & Test Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies & Editable Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Step 1 - Initialize Sample Project (hem init)
        run: python -m hem.cli init

      - name: Step 2 - Build Pipeline Execution (hem build)
        run: python -m hem.cli build

      - name: Step 3 - Preview Impact (hem plan)
        run: python -m hem.cli plan

      - name: Step 4 - Run Operational Doctor Checks (hem doctor)
        run: python -m hem.cli doctor

      - name: Step 5 - Validate Provider SDK (hem sdk-validate ping)
        run: python -m hem.cli sdk-validate ping

      - name: Step 6 - Trace Entity Provenance (hem explain)
        run: python -m hem.cli explain binary_sensor.hem_brume_availability

      - name: Step 7 - Generate Dependency Graph (hem graph)
        run: python -m hem.cli graph

      - name: Step 8 - Auto-Generate Documentation (hem docgen)
        run: python -m hem.cli docgen

      - name: Step 9 - Run Full Test Suite
        run: python -m unittest discover -s tests

[project]
name = "hem"
version = "0.1.0"
description = "HomeLab Enterprise Monitor"
readme = "README.md"
requires-python = ">=3.13"

authors = [
  { name = "Peter Fischer" }
]

dependencies = [
    "typer>=0.17",
    "rich>=14",
    "jinja2>=3.1",
    "PyYAML>=6",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[project.scripts]
hem = "hem.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
